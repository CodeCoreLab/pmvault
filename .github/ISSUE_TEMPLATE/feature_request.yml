name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请尽量说明**你想解决什么问题**，
        而不只是「想要什么功能」——这样更容易讨论出合适的方案。

  - type: dropdown
    id: project
    attributes:
      label: 涉及的项目
      options:
        - xmtool（小马远程桌面）
        - pmvault（密码管理器）
        - work-reminder（工作提醒助手）
        - team-planner（团队协作台）
        - 仓库级（文档 / CI / 构建）
        - 不确定 / 跨项目
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 当前是怎么做的？哪一步很麻烦？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的解决方案
      description: 描述你设想的使用方式，越具体越好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 有没有想过别的做法？为什么不合适？
    validations:
      required: false

  - type: textarea
    id: alternatives2
    attributes:
      label: 使用场景
      description: 谁会用？多久用一次？在什么工作流里？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 和 Discussions，没有找到相同建议
          required: true
        - label: 我愿意参与实现这个功能
          required: false
